{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="RideHub {{ role_label }} portal">
  <title>{{ portal_title }} | RideHub</title>
  <link rel="stylesheet" href="{% static 'css/portal.css' %}?v=20261011">
</head>
<body class="portal-page" data-role="{{ portal_role }}">
  <div class="portal-noise"></div>
  <div class="portal-layout">
    <aside class="portal-sidebar" id="portal-sidebar">
      <a class="portal-brand" href="/" aria-label="RideHub home"><span class="portal-brand-mark">R</span><span><strong>RideHub</strong><small>MOVE FREELY. LIVE MORE.</small></span></a>
      <div class="portal-role"><span class="role-orb">✦</span><div><small>{{ role_label }} SPACE</small><strong>{{ portal_title }}</strong></div></div>
      <nav class="portal-nav" id="portal-nav" aria-label="Portal navigation"></nav>
      <div class="sidebar-bottom"><div class="account-mini"><span class="avatar">{{ user_name|slice:':1'|upper }}</span><div><strong>{{ user_name }}</strong><small>{{ role_label }}</small></div><button class="icon-button" id="profile-shortcut" title="Profile">⋮</button></div><button class="logout-button" id="logout-button"><span>↗</span> Log out</button></div>
    </aside>
    <main class="portal-main">
      <header class="portal-topbar"><button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button><div class="crumb"><span id="crumb-label">Overview</span><small>{{ role_label }} portal</small></div><div class="top-actions"><button class="top-icon" data-coming-soon="Notifications are under development." aria-label="Notifications">♢<i></i></button><button class="top-icon" data-coming-soon="Help centre is under development." aria-label="Help">?</button><span class="header-avatar">{{ user_name|slice:':1'|upper }}</span></div></header>
      <section class="portal-content" id="portal-content" aria-live="polite"></section>
    </main>
  </div>
  <div class="portal-toast" id="portal-toast" role="status"></div>
  <script>window.RIDEHUB_PORTAL={role:"{{ portal_role }}",name:"{{ user_name|escapejs }}",label:"{{ role_label|escapejs }}",csrf:"{{ csrf_token }}"};</script>
  <script src="{% static 'js/portal.js' %}?v=20261011"></script>
</body>
</html>
